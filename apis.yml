name: whatiseven
description: whatiseven (Even, formerly Even Responsible Finance) was an earned-wage-access
  and personal-finance fintech that let workers access a portion of their pay before payday,
  budget with "okay to spend" guidance, and automatically save. Backed by Slow Ventures, Even
  was acquired by One (Walmart's fintech venture, now OnePay) and folded into the OnePay @Work
  earned-wage-access product ("Instapay"). The whatiseven.com domain now redirects through
  even.com to onepay.com/atwork. Even operates no independent public developer platform, API,
  or documentation, and the acquirer OnePay publishes no public API surface either. This profile
  is retained as a network record of the company and its acquisition.
